[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zatca-tools-sdk"
version = "0.1.0"
description = "ZATCA (Fatoora) Phase 2 e-invoicing for Saudi Arabia: onboarding, UBL XML, signing, hashing, QR codes, reporting, clearance and PDF/A-3 invoices — run entirely from your own application."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "ZATCA Tools", email = "support@zatcatools.com" }]
keywords = ["zatca", "fatoora", "e-invoicing", "saudi arabia", "vat", "ubl", "einvoice", "ksa", "pdf/a-3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "lxml>=5",
    "httpx>=0.27",
    # Printed invoices (PDF/A-3). fpdf2 is LGPL-3.0, used unmodified as a separate package.
    "fpdf2>=2.8.9,<3",
    "uharfbuzz>=0.45",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5", "zxing-cpp>=2.2"]

[project.urls]
Homepage = "https://zatcatools.com/docs/sdk"
Documentation = "https://zatcatools.com/docs/sdk"
Source = "https://github.com/muhannadhg/zatca-tools-sdk"
Issues = "https://github.com/muhannadhg/zatca-tools-sdk/issues"
Changelog = "https://github.com/muhannadhg/zatca-tools-sdk/blob/main/CHANGELOG.md"
"ZATCA error reference" = "https://zatcatools.com/en/docs/errors"

[tool.hatch.build.targets.wheel]
packages = ["src/zatca_tools"]

[tool.hatch.build.targets.sdist]
include = ["src/zatca_tools", "tests", "examples", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: talks to ZATCA's public developer-portal sandbox (opt in with ZATCA_SDK_SANDBOX=1)"]
